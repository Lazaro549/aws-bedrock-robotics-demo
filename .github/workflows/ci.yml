name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest-cov

      - name: Run tests with coverage
        env:
          PIPELINE_MODE: mock
        run: pytest -q --cov=src --cov-report=term-missing

      - name: Mock vs mock evaluation (determinism)
        env:
          PIPELINE_MODE: mock
        run: |
          python -m src.evaluate --scenes fixtures/scenes/sample.jsonl --left mock --right mock --out logs/ci-eval.json --csv logs/ci-eval.csv
          python -c "import json; r=json.load(open('logs/ci-eval.json')); assert r['summary']['agreement_rate']==1.0, r['summary']"
